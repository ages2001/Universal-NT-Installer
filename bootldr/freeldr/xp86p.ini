[FreeLoader]
TimeOut=10
DefaultOS=WinXP_AVX_PAE

[Operating Systems]
WinXP_AVX_PAE="Microsoft Windows XP Professional [ACPI+APIC+PAE+AVX]"
WinXP_AVX="Microsoft Windows XP Professional [ACPI+APIC+AVX]"
WinXP_PAE="Microsoft Windows XP Professional [ACPI+APIC+PAE]"
WinXP_TMR="Microsoft Windows XP Professional [ACPI+APIC+TMR]"
WinXP_APIC="Microsoft Windows XP Professional [ACPI+APIC]"
WinXP_ACPI="Microsoft Windows XP Professional [ACPI]"
WinXP_MPS="Microsoft Windows XP Professional [MPS]"
WinXP_STD="Microsoft Windows XP Professional [STD]"

[WinXP_AVX_PAE]
