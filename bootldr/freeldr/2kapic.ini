[FreeLoader]
TimeOut=10
DefaultOS=Win2k_APIC_PAE

[Operating Systems]
Win2k_APIC_PAE="Microsoft Windows 2000 Professional [ACPI+APIC+PAE]"
Win2k_APIC="Microsoft Windows 2000 Professional [ACPI+APIC]"

[Win2k_APIC_PAE]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(1)\WINNT
Options=/PAE /fastdetect

[Win2k_APIC]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(1)\WINNT
Options=/NOPAE /fastdetect
