[FreeLoader]
TimeOut=10
DefaultOS=WinXP_PAE

[Operating Systems]
WinXP_PAE="Microsoft Windows XP Professional [ACPI+APIC+PAE]"
WinXP_APIC="Microsoft Windows XP Professional [ACPI+APIC]"
WinXP_ACPI="Microsoft Windows XP Professional [ACPI]"
WinXP_MPS="Microsoft Windows XP Professional [MPS]"
WinXP_STD="Microsoft Windows XP Professional [STD]"

[WinXP_PAE]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(1)\WINDOWS
Options="/KERNEL=ntkrpamp.exe /HAL=halmacpi.dll /noexecute=optin /fastdetect"

[WinXP_APIC]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(1)\WINDOWS
Options="/KERNEL=ntkrnlmp.exe /HAL=halmacpi.dll /NOPAE /noexecute=optin /fastdetect"

[WinXP_ACPI]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(1)\WINDOWS
Options="/KERNEL=ntkrnlup.exe /HAL=halacpi.dll /noexecute=optin /fastdetect"

[WinXP_MPS]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(1)\WINDOWS
Options="/KERNEL=ntkrnlmp.exe /HAL=halmps.dll /noexecute=optin /fastdetect"

[WinXP_STD]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(1)\WINDOWS
Options="/KERNEL=ntkrnlup.exe /HAL=halstd.dll /noexecute=optin /fastdetect"
