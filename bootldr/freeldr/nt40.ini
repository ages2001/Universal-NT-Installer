[FreeLoader]
TimeOut=10
DefaultOS=WinNT40_MPS

[Operating Systems]
WinNT40_MPS="Windows NT Workstation Version 4.00 [MPS]"
WinNT40_STD="Windows NT Workstation Version 4.00 [STD]"
WinNT40_MPS_VGA="Windows NT Workstation Version 4.00 [MPS] [VGA mode]"
WinNT40_STD_VGA="Windows NT Workstation Version 4.00 [STD] [VGA mode]"

[WinNT40_MPS]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(1)\WINNT4
Options="/KERNEL=ntkrnlmp.exe /HAL=halmps.dll /fastdetect"

[WinNT40_STD]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(1)\WINNT4
Options="/fastdetect"

[WinNT40_MPS_VGA]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(1)\WINNT4
Options="/KERNEL=ntkrnlmp.exe /HAL=halmps.dll /basevideo /sos"

[WinNT40_STD_VGA]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(1)\WINNT4
Options="/basevideo /sos"
