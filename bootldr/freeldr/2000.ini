[FreeLoader]
TimeOut=10
DefaultOS=Win2k_PAE

[Operating Systems]
Win2k_PAE="Microsoft Windows 2000 Professional [ACPI+APIC+PAE]"
Win2k_APIC="Microsoft Windows 2000 Professional [ACPI+APIC]"
Win2k_ACPI="Microsoft Windows 2000 Professional [ACPI]"
Win2k_MPS="Microsoft Windows 2000 Professional [MPS]"
Win2k_STD="Microsoft Windows 2000 Professional [STD]"

[Win2k_PAE]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(1)\WINNT
Options="/KERNEL=ntkrnlmp.exe /HAL=halmacpi.dll /PAE /fastdetect"

[Win2k_APIC]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(1)\WINNT
Options="/KERNEL=ntkrnlmp.exe /HAL=halmacpi.dll /NOPAE /fastdetect"

[Win2k_ACPI]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(1)\WINNT
Options="/KERNEL=ntkrnlup.exe /HAL=halacpi.dll /fastdetect"

[Win2k_MPS]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(1)\WINNT
Options="/KERNEL=ntkrnlmp.exe /HAL=halmps.dll /fastdetect"

[Win2k_STD]
BootType=Windows2003
SystemPath=multi(0)disk(0)rdisk(0)partition(1)\WINNT
Options="/KERNEL=ntkrnlup.exe /HAL=halstd.dll /fastdetect"
