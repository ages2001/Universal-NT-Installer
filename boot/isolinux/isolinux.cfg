DEFAULT modern
UI menu.c32
PROMPT 1
TIMEOUT 150

MENU TITLE  Universal Windows Installer (v0.3.0-beta)
MENU MARGIN 17
MENU VSHIFT 5
MENU ROWS 8
MENU TABMSGROW 16

# ==================== MODERN SYSTEMS SUBMENU ====================
MENU BEGIN modern_menu
    MENU LABEL Start the Installer for Modern Systems
    
    LABEL modern_default
        MENU LABEL   Fast USB Detection
        KERNEL /boot/vmlinew
        APPEND initrd=/boot/core.gz quiet console=tty9 loglevel=0 waitusb=2 host=tc vga=ask

    LABEL modern_full_usb
        MENU LABEL   Full USB Detection
        KERNEL /boot/vmlinew
        APPEND initrd=/boot/core.gz quiet console=tty9 loglevel=0 waitusb=5 host=tc vga=ask
		
    LABEL modern_acpi
        MENU LABEL   Fast USB and Linux Kernel No ACPI+APIC
        KERNEL /boot/vmlinew
        APPEND initrd=/boot/core.gz quiet console=tty9 loglevel=0 acpi=off noapic nolapic waitusb=2 host=tc vga=ask

    LABEL modern_full_usb_acpi
        MENU LABEL   Full USB and Linux Kernel No ACPI+APIC
        KERNEL /boot/vmlinew
        APPEND initrd=/boot/core.gz quiet console=tty9 loglevel=0 acpi=off noapic nolapic waitusb=5 host=tc vga=ask
		
    LABEL \n
        MENU LABEL

    LABEL modern_back
        MENU LABEL   <-- Back to Main Menu
        MENU EXIT
MENU END

# ==================== LEGACY SYSTEMS SUBMENU ====================
MENU BEGIN legacy_menu
    MENU LABEL Start the Installer for Legacy Systems
    
    LABEL legacy_default
        MENU LABEL   Fast USB Detection
        KERNEL /boot/vmliold
        APPEND initrd=/boot/core.gz quiet console=tty9 loglevel=0 waitusb=2 host=tc vga=ask
		
    LABEL legacy_full_usb
        MENU LABEL   Full USB Detection
        KERNEL /boot/vmliold
        APPEND initrd=/boot/core.gz quiet console=tty9 loglevel=0 waitusb=5 host=tc vga=ask

    LABEL legacy_no_usb
        MENU LABEL   No USB Detection
        KERNEL /boot/vmliold
        APPEND initrd=/boot/core.gz quiet console=tty9 loglevel=0 waitusb=0 host=tc vga=ask

    LABEL \n
        MENU LABEL

    LABEL legacy_back
        MENU LABEL   <-- Back to Main Menu
        MENU EXIT
MENU END

LABEL \n
  MENU LABEL

LABEL hdt
  MENU LABEL Hardware Detection Tool
  COM32 hdt.c32
  
LABEL \n
  MENU LABEL

LABEL boot_to_harddisk
  MENU LABEL Boot from First Disk
  COM32 chain.c32
  APPEND hd0

LABEL reboot
  MENU LABEL Reboot the Computer
  COM32 reboot.c32

LABEL poweroff
  MENU LABEL Shutdown the Computer
  COM32 poweroff.c32
  